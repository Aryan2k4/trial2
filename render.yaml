services:
  - type: web
    name: facilityops
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: ENABLE_TENSORFLOW
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# Supply a persistent external PostgreSQL URL, for example Neon Free.
# Render Free Postgres expires after 30 days; do not silently provision it.
