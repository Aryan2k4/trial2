services:
  - type: web
    name: facilityops-app
    env: python
    buildCommand: "if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r backend/requirements.txt; fi"
    startCommand: "if [ -d backend ]; then cd backend; fi && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: VITE_API_BASE_URL
        value: /api
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: facilityops123
