services:
  - type: web
    name: facilityops
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facilityops-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: ENABLE_TENSORFLOW
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: facilityops-db
    databaseName: facilityops
    user: facilityops
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
